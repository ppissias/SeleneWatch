<?xml version="1.0" encoding="UTF-8"?>
<!-- SeleneWatch application icon. Original artwork, BSD-2-Clause like the rest of the project.
     A crescent Moon whose dark side glows with earthshine, a brief impact flash on that dark side,
     and the watching reticle around it. The PNG and ICO files beside it are rendered from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#14254f"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <radialGradient id="earthshine" cx="0.42" cy="0.40" r="0.70">
      <stop offset="0" stop-color="#3d4f74"/>
      <stop offset="1" stop-color="#1b2540"/>
    </radialGradient>
    <linearGradient id="sunlit" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#c9c2a8"/>
      <stop offset="0.55" stop-color="#f3eedb"/>
      <stop offset="1" stop-color="#fffdf2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.22" stop-color="#fff1b8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffb84d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.80" stop-color="#9fb4ff" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#9fb4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="44" cy="50" r="2.4" fill="#d8e0ff" opacity="0.85"/>
  <circle cx="210" cy="38" r="1.9" fill="#d8e0ff" opacity="0.7"/>
  <circle cx="222" cy="210" r="2.1" fill="#d8e0ff" opacity="0.6"/>
  <circle cx="36" cy="204" r="1.7" fill="#d8e0ff" opacity="0.6"/>
  <circle cx="64" cy="226" r="1.3" fill="#d8e0ff" opacity="0.5"/>

  <!-- Watching reticle -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#3ee0cc" stroke-width="5" stroke-opacity="0.9"/>
  <g stroke="#3ee0cc" stroke-width="6" stroke-linecap="round" stroke-opacity="0.95">
    <line x1="128" y1="16" x2="128" y2="34"/>
    <line x1="128" y1="222" x2="128" y2="240"/>
    <line x1="16" y1="128" x2="34" y2="128"/>
    <line x1="222" y1="128" x2="240" y2="128"/>
  </g>

  <!-- Moon: the disc in earthshine, with a faint halo -->
  <circle cx="128" cy="128" r="92" fill="url(#halo)"/>
  <circle cx="128" cy="128" r="84" fill="url(#earthshine)"/>
  <g fill="#16203a" opacity="0.75">
    <ellipse cx="104" cy="96" rx="22" ry="15"/>
    <ellipse cx="86" cy="134" rx="13" ry="18"/>
    <ellipse cx="122" cy="178" rx="18" ry="11"/>
  </g>

  <!-- The sunlit crescent: the disc's right edge, and the terminator back -->
  <path d="M128 44 A84 84 0 0 1 128 212 A36 84 0 0 0 128 44 Z" fill="url(#sunlit)"/>
  <g fill="#b9b196" opacity="0.8">
    <circle cx="190" cy="104" r="6"/>
    <circle cx="197" cy="150" r="4.5"/>
    <circle cx="182" cy="178" r="3.5"/>
  </g>

  <!-- The impact flash on the dark side -->
  <circle cx="96" cy="152" r="34" fill="url(#glow)"/>
  <path d="M96 124 L100.5 147.5 L124 152 L100.5 156.5 L96 180 L91.5 156.5 L68 152 L91.5 147.5 Z" fill="#fffbe6"/>
  <circle cx="96" cy="152" r="5.5" fill="#ffffff"/>
</svg>
